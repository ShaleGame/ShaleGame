name: Multi-target build

on:
  workflow_dispatch:
    inputs:
      build_windows:
        description: 'Build for Windows'
        type: boolean
        default: true
      build_linux:
        description: 'Build for Linux'
        type: boolean
        default: true
      build_mac:
        description: 'Build for Mac'
        type: boolean
        default: true

permissions:
  contents: read
  checks: write
  actions: write

env:
  EXPORT_NAME: ShaleGame
  DOTNET_VERSION: '8.0.x'
  GODOT_VERSION: '4.5.1'
  CONFIGURATION: 'Release'

jobs:
  export:
    runs-on: ubuntu-latest
    container: liphium/godot-mono:4.5.1
    steps:
      - name: Create symbolic link for export templates
        run: ln -s /root/.local /github/home/.local

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build project
        run: |
          dotnet build \
            --configuration ${{ env.CONFIGURATION }}

      - name: Import Godot project
        run: godot --headless --import

      - name: Create build folders
        run: |
          mkdir -p build/windows
          mkdir -p build/linux
          mkdir -p build/mac

      - name: Export Windows executable
        if: inputs.build_windows
        run: godot --headless --export-release Windows\ Desktop build/windows/${EXPORT_NAME}.exe
        continue-on-error: true

      - name: Export Linux executable
        if: inputs.build_linux
        run: godot --headless --export-release Linux build/linux/${EXPORT_NAME}
        continue-on-error: true

      - name: Export Mac executable
        if: inputs.build_mac
        run: godot --headless --export-release macOS build/mac/${EXPORT_NAME}.zip
        continue-on-error: true

      - name: Archive Windows executable
        if: inputs.build_windows
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.EXPORT_NAME }}_windows
          path: build/windows
          if-no-files-found: error

      - name: Archive Linux executable
        if: inputs.build_linux
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.EXPORT_NAME }}_linux
          path: build/linux
          if-no-files-found: error

      - name: Archive Mac executable
        if: inputs.build_mac
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.EXPORT_NAME }}_mac
          path: build/mac
          if-no-files-found: error
